name: ci

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.preset }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: linux-gcc
            runner: ubuntu-latest
            tests: true

          - preset: linux-clang
            runner: ubuntu-latest
            tests: true

          - preset: linux-gcc
            runner: ubuntu-24.04-arm
            tests: true

          - preset: macos-clang
            runner: macos-latest
            tests: true

          - preset: windows-msvc
            runner: windows-latest
            tests: true

          # Builds the demo and nothing else, so that an interface change which breaks the one
          # worked example is caught without every other leg paying for it.
          - preset: linux-gcc-demo
            runner: ubuntu-latest
            tests: false

          # The ext/ lua codec is off by default, so without this leg its tests are compiled and run
          # nowhere. One leg rather than every leg: turning the option on costs a LuaJIT build, and
          # what it exercises is portable c++ over jfc-lua, not anything platform specific.
          - preset: linux-gcc-ext-lua
            runner: ubuntu-latest
            tests: true

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # GLFW needs these to compile its X11 and Wayland backends. The suite itself runs on GLFW's
      # null platform and opens no display, so this is not what makes the tests pass -- it is what
      # stops the Linux legs building a library with no real windowing backend in it.
      - name: install windowing headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xorg-dev libwayland-dev libxkbcommon-dev wayland-protocols

      - name: configure
        run: cmake --preset ${{ matrix.preset }}

      - name: build
        run: cmake --build --preset ${{ matrix.preset }}

      # The tests select GLFW_PLATFORM_NULL themselves, so no display or X server is needed here.
      # Skipped on legs that build no test target, which have no test preset to run.
      - name: test
        if: matrix.tests
        run: ctest --preset ${{ matrix.preset }}
